name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Copy APK to repo root
        run: cp app/build/outputs/apk/debug/app-debug.apk EnglishMVP-fase1-debug.apk

      - name: Commit APK to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f EnglishMVP-fase1-debug.apk
          git commit -m "APK compilado automaticamente [skip ci]" || echo "Sin cambios"
          git push
